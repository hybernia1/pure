<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pure modal scroll tests</title><link rel="stylesheet" href="../dist/pure/pure.css"><style>body{min-height:220vh;padding:var(--p-space-5)}.scroll-region{height:12rem;overflow:auto;border:1px solid var(--p-border);padding:var(--p-space-3)}.scroll-region p{margin-block:var(--p-space-3)}</style></head><body><h1>Modal scroll isolation</h1><p id="result">Running…</p><button class="button" id="open">Open scrollable modal</button><dialog class="modal" id="outer" aria-labelledby="outer-title"><div class="modal-header"><h2 id="outer-title">Scrollable modal</h2><button type="button" data-modal-close aria-label="Close modal"></button></div><div class="modal-body scroll-region" id="scroller" tabindex="0" aria-label="Scrollable content"></div><button class="button" id="nested">Open nested modal</button></dialog><dialog class="modal" id="inner" aria-labelledby="inner-title"><h2 id="inner-title">Nested modal</h2><button class="button" data-modal-close aria-label="Close nested modal">Close nested modal</button></dialog><script type="module">
const variant=new URLSearchParams(location.search).has('min')?'pure.min':'pure';const {createModal}=await import(`../dist/${variant}/js/modal.js`);const a=document.querySelector('#outer'),b=document.querySelector('#inner');const outer=createModal(a),inner=createModal(b);const assert=(value,message)=>{if(!value)throw Error(message)};
for(let index=0;index<30;index++){const p=document.createElement('p');p.textContent=`Content row ${index+1}`;document.querySelector('#scroller').append(p);}
try{
 window.scrollTo(0,300);const position=scrollY;
 const previous=document.documentElement.style.overflow;outer.open();assert(Math.abs(scrollY-position)<1,'Opening changed page scroll');inner.open();inner.close();assert(getComputedStyle(document.documentElement).overflow==='hidden','Nested close unlocks page');outer.close();assert(document.documentElement.style.overflow===previous,'Previous overflow not restored');assert(Math.abs(scrollY-position)<1,'Closing changed page scroll');
 outer.open();a.close();outer.open();await new Promise(resolve=>setTimeout(resolve,0));assert(getComputedStyle(document.documentElement).overflow==='hidden','Stale close unlocks new modal');outer.close();
 document.querySelector('#result').textContent='PASS: nested scroll locks, queued close/reopen, exact restoration · '+variant;
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.stack;console.error(error)}
document.querySelector('#open').addEventListener('click',()=>outer.open());document.querySelector('#nested').addEventListener('click',()=>inner.open());
</script></body></html>
