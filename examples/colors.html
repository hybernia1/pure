<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pure — template colors</title><link rel="stylesheet" href="palette.css"><style>
/* All named values below belong to this example template. */
:root[data-scheme="journal"]{--p-light-red:#9b675f;--p-light-blue:#476a80;--p-light-green:#72774e;--p-dark-red:#dfb2a9;--p-dark-blue:#a8c7d5;--p-dark-green:#c6c99e}
main{max-width:54rem;margin:auto;padding:var(--p-space-5);display:grid;gap:var(--p-space-4)}.actions,.palette{display:flex;flex-wrap:wrap;gap:var(--p-space-3)}.sample{padding:var(--p-space-3);display:grid;gap:var(--p-space-2)}.swatch{width:5rem;height:3rem;border-radius:var(--p-radius-sm)}
</style></head><body><main><a href="index.html">All examples</a><h1>Template-defined color names</h1><p>Pure supplies names and utilities. This example template supplies every named color value.</p><div class="actions"><button class="button button-outline" data-theme-toggle>Light / dark</button><button class="button button-outline" data-scheme-set="default">Default palette</button><button class="button button-outline" data-scheme-set="journal">Journal palette</button></div><div class="palette" id="palette"></div><p class="text-blue">This text uses text-blue.</p><p class="border border-red sample">This border uses border-red, independently of error state.</p></main><script type="module">
const variant=new URLSearchParams(location.search).has('min')?'pure.min':'pure';const link=document.createElement('link');link.rel='stylesheet';link.href=`../dist/${variant}/pure.css`;document.head.append(link);
const {loadComponent}=await import(`../dist/${variant}/js/lazy.js`);const [{colorNames},{initTheme}]=await Promise.all(['colors','theme'].map(name=>loadComponent(name)));initTheme();
for(const name of colorNames){const item=document.createElement('div');item.className='sample border rounded';const swatch=document.createElement('div');swatch.className=`swatch bg-${name}`;swatch.setAttribute('aria-hidden','true');const label=document.createElement('code');label.textContent=`--p-${name}`;item.append(swatch,label);document.querySelector('#palette').append(item)}
</script></body></html>
