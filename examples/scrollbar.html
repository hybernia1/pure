<!doctype html><html lang="en" class="scrollbars"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pure — scrollbars</title><link rel="stylesheet" href="../dist/pure/css/tokens.css"><link rel="stylesheet" href="../dist/pure/css/base.css"><link rel="stylesheet" href="../dist/pure/css/components.css"><style>main{max-width:50rem;margin:auto;padding:var(--p-space-5);display:grid;gap:var(--p-space-4)}.scroll-example{max-height:16rem;overflow:auto;border:1px solid var(--p-border);border-radius:var(--p-radius-sm);padding:var(--p-space-3)}.scroll-example p{padding-block:var(--p-space-2);border-bottom:1px solid var(--p-border)}#horizontal p{min-width:80rem}textarea{height:10rem}button{justify-self:start}</style></head><body><main><a href="index.html">All examples</a><h1>Native custom scrollbars</h1><p>Semantic colors, keyboard access and no scrolling JavaScript.</p><button class="button button-outline" data-theme-toggle>Light / dark</button><h2 id="activity-title">Activity</h2><div class="scroll-example scrollbar-stable" tabindex="0" role="region" aria-labelledby="activity-title" id="vertical"></div><h2 id="records-title">Wide records</h2><div class="scroll-example" tabindex="0" role="region" aria-labelledby="records-title" id="horizontal"></div><label for="notes">Notes</label><textarea id="notes" class="input"></textarea></main><script type="module">
const variant=new URLSearchParams(location.search).has('min')?'pure.min':'pure';
const {ensureStyles,loadComponent}=await import(`../dist/${variant}/js/lazy.js`);await ensureStyles('scrollbar');const {initTheme}=await loadComponent('theme');initTheme();
for(let index=1;index<=24;index++){const p=document.createElement('p');p.textContent=`${index}. Saved a draft and updated its tags.`;document.querySelector('#vertical').append(p);}
for(let index=1;index<=6;index++){const p=document.createElement('p');p.textContent=`Record ${index} — title / author / category / status / published / views / media / tags / updated / notes`;document.querySelector('#horizontal').append(p);}
document.querySelector('#notes').value=Array.from({length:24},(_,index)=>`Note ${index+1}: keyboard, selection and scrolling stay native.`).join('\n');
</script></body></html>
